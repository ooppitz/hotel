<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit room</title>
</head>
<body>

<h1>Edit Room</h1>

<div>
    <label>Room number:</label>
    <span th:text="${room.number}"></span> <br> <br>
</div>

<form th:action="@{/rooms/update/{number}(number=${room.number})}" method = "post">

    <label for="features">Features:</label><br>
    <input type="text" id="features" name="features" style="width: 300px" th:value="${room.features}"><br><br>

    <input type="submit" value="Save"/>

</form>
</body>
</html>
