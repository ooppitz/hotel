<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alternating Row Colors</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        .my_even {
            background-color: #f2f2f2; /* Light gray for even rows */
        }
        .my_odd {
            background-color: #ffffff; /* White for odd rows */
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
    </style>
</head>
<body>

<table>
    <thead>
    <tr>
        <th class="my_odd">Header 1</th>
        <th class="my_even">Header 2</th>
    </tr>
    </thead>
    <tbody>
    <tr>
        <td>Row 1, Cell 1</td>
        <td>Row 1, Cell 2</td>
    </tr>
    <tr>
        <td>Row 2, Cell 1</td>
        <td>Row 2, Cell 2</td>
    </tr>
    <tr>
        <td>Row 3, Cell 1</td>
        <td>Row 3, Cell 2</td>
    </tr>
    <tr>
        <td>Row 4, Cell 1</td>
        <td>Row 4, Cell 2</td>
    </tr>
    </tbody>
</table>

</body>
</html>
